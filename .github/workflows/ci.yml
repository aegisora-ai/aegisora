name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: Go 1.27 Sidecar
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/sidecar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: false

      - name: Verify formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test with race detector
        run: make test-race

      - name: Build service and policy tools
        run: make build tools

  oss:
    name: OSS Build + Typecheck + Test + Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Example smoke test
        run: pnpm --filter "@aegisora/example-langgraph-agent-governance" start
