name: Good first contribution
description: Volunteer for a small, clearly scoped contribution to Aegisora.
title: "[Contribution]: "
labels:
  - good first contribution
  - growth

body:
  - type: markdown
    attributes:
      value: |
        ## Start contributing to Aegisora

        You do not need to be a core maintainer.
        Small, focused contributions are welcome.

  - type: dropdown
    id: contribution_type
    attributes:
      label: Contribution type
      options:
        - Code
        - Test
        - Documentation
        - Developer experience
        - Example
        - Benchmark
        - UI / UX
        - Security hardening
    validations:
      required: true

  - type: input
    id: issue
    attributes:
      label: Issue number
      description: Which issue are you planning to work on?
      placeholder: "#4"
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Briefly explain how you plan to solve it.
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: Relevant experience
      description: Optional. Mention languages, frameworks, or similar projects.
    validations:
      required: false
